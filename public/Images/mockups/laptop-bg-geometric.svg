<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <radialGradient id="bgBase" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Pattern grid color -->
    <pattern id="gridPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Horizontal line -->
      <line x1="0" y1="0" x2="60" y2="0" stroke="#F97316" stroke-width="0.4" opacity="0.12"/>
      <!-- Vertical line -->
      <line x1="0" y1="0" x2="0" y2="60" stroke="#F97316" stroke-width="0.4" opacity="0.12"/>
      <!-- Node dot at intersection -->
      <circle cx="0" cy="0" r="1.2" fill="#F97316" opacity="0.2"/>
    </pattern>
    <!-- Diagonal accent lines pattern -->
    <pattern id="diagPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#F97316" stroke-width="0.6" opacity="0.07"/>
    </pattern>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="screenReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="30" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    <!-- Center fade mask to make grid fade outward -->
    <radialGradient id="gridFade" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1400" height="900" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bgBase)"/>

  <!-- Grid pattern layer with fade -->
  <rect width="1400" height="900" fill="url(#gridPattern)" mask="url(#gridMask)"/>

  <!-- Diagonal lines accent -->
  <rect width="1400" height="900" fill="url(#diagPattern)" opacity="0.5"/>

  <!-- Geometric accent shapes (angular fragments) -->
  <!-- Top-right angular element -->
  <polygon points="1140,0 1400,0 1400,220 1260,180" fill="none" stroke="#F97316" stroke-width="0.8" opacity="0.1"/>
  <polygon points="1200,0 1400,0 1400,130" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.07"/>
  <!-- Bottom-left angular element -->
  <polygon points="0,700 180,900 0,900" fill="none" stroke="#F97316" stroke-width="0.8" opacity="0.1"/>
  <polygon points="0,780 100,900 0,900" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.07"/>

  <!-- Vignette overlay -->
  <rect width="1400" height="900" fill="url(#vignette)"/>

  <!-- Device shadow -->
  <ellipse cx="700" cy="640" rx="420" ry="22" fill="black" opacity="0.85"/>

  <!-- ── Laptop base/keyboard ── -->
  <rect x="252" y="590" width="896" height="42" rx="5" fill="url(#baseGrad)" filter="url(#shadow)"/>
  <rect x="252" y="590" width="896" height="1.5" fill="#3c3c3c" opacity="0.7"/>
  <!-- Trackpad -->
  <rect x="600" y="598" width="200" height="26" rx="4" fill="#1c1c1c" opacity="0.8"/>
  <!-- Keyboard row hints -->
  <rect x="290" y="596" width="260" height="4" rx="2" fill="#202020" opacity="0.6"/>
  <rect x="560" y="596" width="40" height="4" rx="2" fill="#202020" opacity="0.6"/>
  <rect x="850" y="596" width="260" height="4" rx="2" fill="#202020" opacity="0.6"/>

  <!-- ── Laptop lid ── -->
  <rect x="290" y="75" width="820" height="515" rx="14" fill="url(#frameGrad)" filter="url(#shadow)"/>
  <rect x="290" y="75" width="820" height="515" rx="14" fill="none" stroke="#383838" stroke-width="1"/>

  <!-- Bezel -->
  <rect x="310" y="92" width="780" height="480" rx="8" fill="#0c0c0c"/>

  <!-- Screen -->
  <rect x="322" y="102" width="756" height="460" rx="4" fill="url(#screenBg)"/>

  <!-- Screenshot placeholder -->
  <rect x="322" y="102" width="756" height="460" rx="4" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="10,6" opacity="0.35"/>

  <!-- Placeholder icon -->
  <g transform="translate(700, 308)" opacity="0.45">
    <rect x="-30" y="-24" width="60" height="48" rx="5" fill="none" stroke="#F97316" stroke-width="2"/>
    <circle cx="-10" cy="-8" r="8" fill="none" stroke="#F97316" stroke-width="2"/>
    <polyline points="-30,18 -16,2 -4,12 10,-4 30,18" fill="none" stroke="#F97316" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Placeholder text -->
  <text x="700" y="358" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#F97316" opacity="0.55" letter-spacing="3">SCREENSHOT PLACEHOLDER</text>
  <text x="700" y="378" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#555" letter-spacing="1">1512 × 920 px recommended</text>

  <!-- Screen glass reflection -->
  <rect x="322" y="102" width="756" height="460" rx="4" fill="url(#screenReflect)"/>

  <!-- Camera dot -->
  <circle cx="700" cy="97" r="4.5" fill="#181818"/>
  <circle cx="700" cy="97" r="2.5" fill="#0d0d0d"/>
  <circle cx="699" cy="96" r="1" fill="#303030" opacity="0.7"/>

  <!-- Concept label -->
  <text x="700" y="866" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#383838" letter-spacing="4">BACKGROUND CONCEPT 03 — ABSTRACT GEOMETRIC LINES</text>
</svg>
