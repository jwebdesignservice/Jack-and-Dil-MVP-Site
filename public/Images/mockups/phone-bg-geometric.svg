<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1000" width="560" height="1000">
  <defs>
    <radialGradient id="bgBase" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.75"/>
    </radialGradient>
    <pattern id="gridPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#F97316" stroke-width="0.4" opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="#F97316" stroke-width="0.4" opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#F97316" opacity="0.18"/>
    </pattern>
    <pattern id="diagPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <line x1="0" y1="0" x2="0" y2="100" stroke="#F97316" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <radialGradient id="gridFade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="560" height="1000" fill="url(#gridFade)"/>
    </mask>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="frameEdge" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#383838"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#282828"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="screenReflect" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="45%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="1000" fill="url(#bgBase)"/>
  <rect width="560" height="1000" fill="url(#gridPattern)" mask="url(#gridMask)"/>
  <rect width="560" height="1000" fill="url(#diagPattern)" opacity="0.5"/>

  <!-- Angular accents -->
  <polygon points="420,0 560,0 560,200 480,160" fill="none" stroke="#F97316" stroke-width="0.8" opacity="0.1"/>
  <polygon points="0,800 120,1000 0,1000" fill="none" stroke="#F97316" stroke-width="0.8" opacity="0.1"/>

  <!-- Vignette -->
  <rect width="560" height="1000" fill="url(#vignette)"/>

  <!-- Device shadow -->
  <ellipse cx="280" cy="868" rx="160" ry="16" fill="black" opacity="0.85"/>

  <!-- ── Phone frame ── -->
  <rect x="138" y="68" width="284" height="580" rx="38" fill="url(#frameGrad)" filter="url(#shadow)"/>
  <rect x="138" y="68" width="284" height="580" rx="38" fill="none" stroke="url(#frameEdge)" stroke-width="1.5"/>

  <!-- Side buttons left (volume) -->
  <rect x="133" y="210" width="7" height="42" rx="3.5" fill="#222"/>
  <rect x="133" y="262" width="7" height="42" rx="3.5" fill="#222"/>
  <!-- Power button right -->
  <rect x="420" y="228" width="7" height="56" rx="3.5" fill="#222"/>

  <!-- Screen area -->
  <rect x="152" y="82" width="256" height="552" rx="28" fill="url(#screenBg)"/>

  <!-- Dynamic island -->
  <rect x="234" y="94" width="92" height="30" rx="15" fill="#0a0a0a"/>

  <!-- Screenshot placeholder area -->
  <rect x="152" y="124" width="256" height="500" rx="4" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.32"/>

  <!-- Placeholder icon -->
  <g transform="translate(280, 340)" opacity="0.42">
    <rect x="-22" y="-18" width="44" height="36" rx="4" fill="none" stroke="#F97316" stroke-width="1.8"/>
    <circle cx="-7" cy="-5" r="6" fill="none" stroke="#F97316" stroke-width="1.8"/>
    <polyline points="-22,14 -12,2 -3,9 8,-3 22,14" fill="none" stroke="#F97316" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Placeholder text -->
  <text x="280" y="390" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#F97316" opacity="0.5" letter-spacing="2">SCREENSHOT PLACEHOLDER</text>
  <text x="280" y="408" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" fill="#444" letter-spacing="1">390 × 844 px recommended</text>

  <!-- Home indicator -->
  <rect x="220" y="610" width="120" height="4" rx="2" fill="#333" opacity="0.7"/>

  <!-- Screen glass reflection -->
  <rect x="152" y="82" width="256" height="552" rx="28" fill="url(#screenReflect)"/>

  <!-- Concept label -->
  <text x="280" y="972" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#383838" letter-spacing="3">CONCEPT 03 — GEOMETRIC LINES</text>
</svg>
