<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" width="1080" height="780">
  <defs>
    <radialGradient id="bgBase" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#060606"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="orangeBloom" cx="50%" cy="78%" r="65%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#EA580C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topAmbient" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#1a0c05" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="screenReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="32" flood-color="#F97316" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="5" stdDeviation="14" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1080" height="780" fill="url(#bgBase)"/>
  <rect width="1080" height="780" fill="url(#topAmbient)"/>
  <ellipse cx="540" cy="700" rx="640" ry="520" fill="url(#orangeBloom)"/>
  <!-- Subtle accent line -->
  <rect x="0" y="560" width="1080" height="1.5" fill="#F97316" opacity="0.06"/>

  <!-- Device shadow with orange tinge -->
  <ellipse cx="540" cy="668" rx="360" ry="16" fill="black" opacity="0.9"/>
  <ellipse cx="540" cy="670" rx="280" ry="8" fill="#F97316" opacity="0.07"/>

  <!-- ── Tablet frame ── -->
  <rect x="172" y="82" width="736" height="524" rx="22" fill="url(#frameGrad)" filter="url(#shadow)"/>
  <rect x="172" y="82" width="736" height="524" rx="22" fill="none" stroke="#383838" stroke-width="1"/>

  <!-- Side buttons (right) -->
  <rect x="906" y="240" width="6" height="40" rx="3" fill="#222"/>
  <rect x="906" y="290" width="6" height="40" rx="3" fill="#222"/>
  <!-- Top button -->
  <rect x="440" y="77" width="48" height="7" rx="3" fill="#222"/>

  <!-- Camera dot (right bezel) -->
  <circle cx="897" cy="344" r="5" fill="#1a1a1a"/>
  <circle cx="897" cy="344" r="2.5" fill="#0d0d0d"/>

  <!-- Bezel inner -->
  <rect x="192" y="100" width="696" height="488" rx="12" fill="#0c0c0c"/>

  <!-- Screen -->
  <rect x="204" y="110" width="672" height="468" rx="6" fill="url(#screenBg)"/>

  <!-- Screenshot placeholder -->
  <rect x="204" y="110" width="672" height="468" rx="6" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="10,6" opacity="0.35"/>

  <!-- Placeholder icon -->
  <g transform="translate(540, 320)" opacity="0.45">
    <rect x="-28" y="-22" width="56" height="44" rx="5" fill="none" stroke="#F97316" stroke-width="2"/>
    <circle cx="-9" cy="-7" r="8" fill="none" stroke="#F97316" stroke-width="2"/>
    <polyline points="-28,18 -14,2 -4,11 10,-4 28,18" fill="none" stroke="#F97316" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Placeholder text -->
  <text x="540" y="370" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#F97316" opacity="0.55" letter-spacing="3">SCREENSHOT PLACEHOLDER</text>
  <text x="540" y="390" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#555" letter-spacing="1">1344 × 936 px recommended</text>

  <!-- Screen glass reflection -->
  <rect x="204" y="110" width="672" height="468" rx="6" fill="url(#screenReflect)"/>

  <!-- Concept label -->
  <text x="540" y="756" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#383838" letter-spacing="4">BACKGROUND CONCEPT 02 — SOFT ORANGE LIGHT FLARE</text>
</svg>
