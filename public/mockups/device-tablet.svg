<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1600" width="2200" height="1600">
  <defs>
    <!-- Tablet body gradient -->
    <linearGradient id="tabletBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1C1C1E"/>
      <stop offset="100%" stopColor="#0F0F0F"/>
    </linearGradient>
    <!-- Screen reflection -->
    <linearGradient id="tabletReflect" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.05"/>
      <stop offset="35%" stopColor="#ffffff" stopOpacity="0"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="tabletShadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="25" stdDeviation="55" floodColor="#000000" floodOpacity="0.85"/>
      <feDropShadow dx="0" dy="5" stdDeviation="18" floodColor="#F97316" floodOpacity="0.06"/>
    </filter>
    <!-- Screen placeholder pattern -->
    <pattern id="tabletPlaceholder" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#0A0A0A"/>
      <line x1="0" y1="18" x2="36" y2="18" stroke="rgba(249,115,22,0.05)" strokeWidth="0.8"/>
      <line x1="18" y1="0" x2="18" y2="36" stroke="rgba(249,115,22,0.05)" strokeWidth="0.8"/>
    </pattern>
    <!-- Orange horizontal accent -->
    <linearGradient id="tabletOrangeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#F97316" stopOpacity="0"/>
      <stop offset="25%" stopColor="#F97316"/>
      <stop offset="75%" stopColor="#EA580C"/>
      <stop offset="100%" stopColor="#EA580C" stopOpacity="0"/>
    </linearGradient>
  </defs>

  <!-- ─── TABLET DEVICE (landscape) ─── -->
  <g filter="url(#tabletShadow)">
    <!-- Outer frame -->
    <rect x="80" y="80" width="2040" height="1440" rx="40" fill="url(#tabletBody)" stroke="rgba(255,255,255,0.05)" strokeWidth="1.5"/>

    <!-- Edge highlights -->
    <rect x="80" y="80" width="2040" height="2" rx="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="80" y="80" width="2" height="1440" rx="1" fill="rgba(255,255,255,0.06)"/>
    <rect x="2118" y="80" width="2" height="1440" rx="1" fill="rgba(255,255,255,0.02)"/>

    <!-- Screen area (slim bezels) -->
    <rect x="110" y="110" width="1980" height="1380" rx="26" fill="#000000"/>

    <!-- ── SCREEN CONTENT AREA (replace with screenshot <image>) ── -->
    <rect id="screen-content" x="110" y="110" width="1980" height="1380" rx="26" fill="url(#tabletPlaceholder)"/>

    <!-- Screen content placeholder label -->
    <text x="1100" y="775" fontFamily="Inter, -apple-system, sans-serif" fontSize="32" fill="rgba(249,115,22,0.28)" textAnchor="middle" fontWeight="300" letterSpacing="0.15em">YOUR SCREENSHOT HERE</text>
    <text x="1100" y="830" fontFamily="Inter, -apple-system, sans-serif" fontSize="18" fill="rgba(255,255,255,0.1)" textAnchor="middle" fontWeight="300">1980 × 1380 px</text>
    <rect x="110" y="110" width="1980" height="1380" rx="26" fill="none" stroke="rgba(249,115,22,0.12)" strokeWidth="1.5" strokeDasharray="14 9"/>

    <!-- Screen reflection -->
    <rect x="110" y="110" width="1980" height="1380" rx="26" fill="url(#tabletReflect)"/>

    <!-- Front camera (landscape — right side center) -->
    <circle cx="2090" cy="800" r="14" fill="#0A0A0A"/>
    <circle cx="2090" cy="800" r="8" fill="#060606"/>
    <circle cx="2088" cy="798" r="2.5" fill="rgba(255,255,255,0.07)"/>

    <!-- Volume + power buttons (top edge) -->
    <rect x="500" y="77" width="100" height="6" rx="3" fill="#2A2A2A"/>
    <rect x="630" y="77" width="100" height="6" rx="3" fill="#2A2A2A"/>
    <rect x="1500" y="77" width="140" height="6" rx="3" fill="#2A2A2A"/>

    <!-- Orange accent line (bottom edge of device) -->
    <rect x="80" y="1516" width="2040" height="2" rx="1" fill="url(#tabletOrangeH)" opacity="0.5"/>

    <!-- Smart connector dots (bottom) -->
    <circle cx="960" cy="1523" r="4" fill="#1A1A1A"/>
    <circle cx="1100" cy="1523" r="4" fill="#1A1A1A"/>
    <circle cx="1240" cy="1523" r="4" fill="#1A1A1A"/>
  </g>
</svg>
